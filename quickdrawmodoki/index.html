<!DOCTYPE html>

<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Draw もどき</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');

    :root {
      --ink: #1a1a2e;
      --paper: #f5f0e8;
      --paper2: #ede8dc;
      --line: #c8c0aa;
      --accent: #e63946;
      --blue: #457b9d;
      --green: #2d6a4f;
      --yellow: #f4a261;
      --text: #2c2c2c;
      --muted: #888070;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--paper);
      color: var(--text);
      font-family: 'M PLUS Rounded 1c', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* ノート罫線背景 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: repeating-linear-gradient(transparent, transparent 27px,
          rgba(180, 170, 150, 0.25) 27px, rgba(180, 170, 150, 0.25) 28px);
      pointer-events: none;
      z-index: 0;
    }

    /* 左の赤い縦線 */
    body::after {
      content: ‘’;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 52px;
      width: 2px;
      background: rgba(220, 80, 80, 0.2);
      pointer-events: none;
      z-index: 0;
    }

    header {
      width: 100%;
      background: var(--ink);
      color: var(--paper);
      padding: 18px 24px 16px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    header h1 {
      font-family: ‘Boogaloo’, cursive;
      font-size: 2rem;
      letter-spacing: 1px;
      color: var(–yellow);
    }

    header p {
      font-size: 0.82rem;
      color: rgba(245, 240, 232, 0.55);
      font-weight: 700;
    }

    .score-pill {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }

    .pill {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.82rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .pill.c {
      background: rgba(45, 106, 79, 0.5);
    }

    .pill.w {
      background: rgba(230, 57, 70, 0.35);
    }

    .main {
      width: 100%;
      max-width: 500px;
      padding: 20px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    /* ローディング */
    .loading-card {
      background: var(–ink);
      color: var(–paper);
      border-radius: 16px;
      padding: 20px 24px;
      text-align: center;
    }

    .loading-card p {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: rgba(245, 240, 232, 0.7);
    }

    .progress-wrap {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(–yellow), var(–accent));
      width: 0%;
      transition: width 0.3s;
    }

    /* お題 */
    .prompt-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .prompt-box {
      flex: 1;
      background: white;
      border: 2px solid var(–ink);
      border-radius: 14px;
      padding: 12px 18px;
      box-shadow: 4px 4px 0 var(–ink);
      position: relative;
    }

    .prompt-box .tag {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(–muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .prompt-box .word {
      font-family: ‘Boogaloo’, cursive;
      font-size: 2.2rem;
      color: var(–accent);
      line-height: 1.1;
      margin-top: 2px;
    }

    /* タイマー */
    .timer-circle {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      position: relative;
    }

    .timer-circle svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .timer-circle .bg {
      fill: none;
      stroke: var(–paper2);
      stroke-width: 6;
    }

    .timer-circle .fg {
      fill: none;
      stroke: var(–accent);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 163;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.5s;
    }

    .timer-num {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ‘Boogaloo’, cursive;
      font-size: 1.4rem;
      color: var(–ink);
    }

    /* キャンバスエリア */
    .canvas-wrap {
      position: relative;
      border: 3px solid var(–ink);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 6px 6px 0 var(–ink);
      cursor: crosshair;
      touch-action: none;
      background: white;
    }

    canvas {
      display: block;
      width: 100%;
      background: white;
    }

    /* 判定バー（キャンバス下部） */
    .confidence-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(26, 26, 46, 0.88);
      backdrop-filter: blur(6px);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .conf-row {
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .conf-row.visible {
      opacity: 1;
      transform: none;
    }

    .conf-label {
      font-size: 0.78rem;
      font-weight: 800;
      color: rgba(245, 240, 232, 0.6);
      width: 70px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conf-label.match {
      color: #7be8c0;
    }

    .conf-bar-wrap {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
    }

    .conf-bar {
      height: 100%;
      border-radius: 999px;
      background: rgba(245, 240, 232, 0.3);
      transition: width 0.35s ease;
    }

    .conf-bar.match {
      background: linear-gradient(90deg, #2d6a4f, #7be8c0);
    }

    .conf-pct {
      font-size: 0.75rem;
      font-weight: 800;
      color: rgba(245, 240, 232, 0.5);
      width: 34px;
      text-align: right;
      flex-shrink: 0;
    }

    .conf-pct.match {
      color: #7be8c0;
    }

    /* ツールバー */
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .tbtn {
      background: white;
      border: 2px solid var(--ink);
      border-radius: 10px;
      color: var(--ink);
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 7px 12px;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
      transition: all 0.1s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tbtn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .tbtn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .tbtn.active {
      background: var(--ink);
      color: var(--paper);
    }

    .size-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .size-wrap span {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--muted);
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 70px;
      height: 5px;
      background: var(--line);
      border-radius: 999px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--ink);
      cursor: pointer;
    }

    /* 正解演出 */
    .result-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .result-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .result-card {
      background: white;
      border: 3px solid var(--ink);
      border-radius: 24px;
      padding: 36px 40px;
      text-align: center;
      box-shadow: 8px 8px 0 var(--ink);
      max-width: 340px;
      width: 88%;
      transform: scale(0.8) rotate(-2deg);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .result-overlay.show .result-card {
      transform: scale(1) rotate(0deg);
    }

    .result-emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 8px;
    }

    .result-title {
      font-family: 'Boogaloo', cursive;
      font-size: 2.4rem;
      line-height: 1;
      margin-bottom: 8px;
    }

    .result-title.correct {
      color: var(--green);
    }

    .result-title.wrong {
      color: var(--accent);
    }

    .result-detail {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .result-next {
      width: 100%;
      padding: 13px;
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: 12px;
      font-family: 'Boogaloo', cursive;
      font-size: 1.3rem;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.15s;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
    }

    .result-next:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.3);
    }
  </style>

</head>

<body>

  <header>
    <h1>✏️ Quick Draw もどき</h1>
    <p>自作CNNモデルで判定</p>
    <div class="score-pill">
      <div class="pill c">✅ <span id="cScore">0</span></div>
      <div class="pill w">❌ <span id="wScore">0</span></div>
    </div>
  </header>

  <div class="main">

    <div class="loading-card" id="loadingCard">
      <p id="loadingText">モデルを読み込み中...</p>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="prompt-section">
      <div class="prompt-box">
        <div class="tag">✏️ お題</div>
        <div class="word" id="promptWord">...</div>
      </div>
      <div class="timer-circle" id="timerCircle">
        <svg viewBox="0 0 56 56">
          <circle class="bg" cx="28" cy="28" r="26" />
          <circle class="fg" id="timerArc" cx="28" cy="28" r="26" />
        </svg>
        <div class="timer-num" id="timerNum">20</div>
      </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas" width="600" height="600"></canvas>
      <div class="confidence-overlay" id="confOverlay">
      </div>
    </div>
    <div class="toolbar">
      <button class="tbtn active" id="penBtn" onclick="setTool('pen')">ペン</button>
      <button class="tbtn" id="eraserBtn" onclick="setTool('eraser')">消す</button>
      <button class="tbtn" onclick="clearCanvas()">全消し</button>
      <div class="size-wrap">
        <span>太さ</span>
        <input type="range" id="sizeSlider" min="2" max="20" value="8">
      </div>
    </div>

  </div>

  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <span class="result-emoji" id="resEmoji">🎉</span>
      <div class="result-title" id="resTitle">正解！</div>
      <div class="result-detail" id="resDetail"></div>
      <button class="result-next" onclick="nextRound()">次のお題 →</button>
    </div>
  </div>

  <script>
    const MODEL_URL = 'https://oasoobi.github.io/playground/quickdrawmodoki/model.json';

    const CLASSES = [
      "cat",
      "dog",
      "fish",
      "house",
      "tree",
      "car",
      "airplane",
      "bicycle",
      "umbrella",
      "flower",
      "bread",
      "horse",
      "apple",
      "bird",
      "banana",
      "boat",
      "book",
      "bridge",
      "cake",
      "candle",
      "leaf",
      "watch",
      "window",
      "star",
      "mountain",
      "fire",
      "heart"
    ];

    const JA_MAP = {
      cat: '猫', dog: '犬', fish: '魚', house: '家', tree: '木',
      car: '車', airplane: '飛行機', bicycle: '自転車', umbrella: '傘', flower: '花',
      bird: '鳥', apple: 'りんご', banana: 'バナナ', boat: 'ボート', book: '本',
      bridge: '橋', butterfly: '蝶', cake: 'ケーキ', camera: 'カメラ', candle: 'ろうそく',
      chair: '椅子', clock: '時計', cloud: '雲', coffee: 'コーヒー', crown: '王冠',
      cup: 'カップ', diamond: 'ダイヤ', door: 'ドア', elephant: '象', eye: '目',
      face: '顔', fire: '炎', fork: 'フォーク', guitar: 'ギター', hammer: 'ハンマー',
      hand: '手', hat: '帽子', heart: 'ハート', horse: '馬', key: '鍵',
      knife: 'ナイフ', ladder: 'はしご', leaf: '葉', lion: 'ライオン', moon: '月',
      mountain: '山', mouse: 'マウス', mushroom: 'きのこ', pencil: '鉛筆', pizza: 'ピザ',
      rabbit: 'うさぎ', rainbow: '虹', ring: '指輪', rocket: 'ロケット', scissors: 'はさみ',
      shoe: '靴', star: '星', sun: '太陽', sword: '剣', table: 'テーブル',
      telephone: '電話', tiger: '虎', train: '電車', truck: 'トラック', turtle: '亀',
      watch: '時計', whale: 'クジラ', wheel: '車輪', window: '窓', wolf: '狼',
    };

    function toJa(en) {
      return JA_MAP[en] ?? en;
    }

    let model = null;
    let currentIdx = 0;
    let tool = 'pen';
    let isDrawing = false;
    let timeLeft = 20;
    let timerInterval = null;
    let classifyInterval = null;
    let score = { c: 0, w: 0 };
    let answered = false;
    const CIRCUMFERENCE = 2 * Math.PI * 26; // ≈163

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const sx = canvas.width / rect.width;
      const sy = canvas.height / rect.height;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
    }

    canvas.addEventListener('mousedown', e => { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
    canvas.addEventListener('mousemove', e => {
      if (!isDrawing) return;
      applyTool(getPos(e));
    });
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mouseleave', () => isDrawing = false);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!isDrawing) return;
      applyTool(getPos(e));
    }, { passive: false });
    canvas.addEventListener('touchend', () => isDrawing = false);

    function applyTool(p) {
      const size = parseInt(document.getElementById('sizeSlider').value);
      ctx.lineWidth = tool === 'eraser' ? size * 3 : size;
      ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : '#111111';
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function setTool(t) {
      tool = t;
      document.getElementById('penBtn').classList.toggle('active', t === 'pen');
      document.getElementById('eraserBtn').classList.toggle('active', t === 'eraser');
    }

    function clearCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    async function loadModel() {
      try {
        animateProgress();

        model = await tf.loadGraphModel(MODEL_URL);
        const dummy = tf.zeros([1, 28, 28, 1]);
        model.predict(dummy).dispose();
        dummy.dispose();

        document.getElementById('loadingCard').style.display = 'none';
        newRound();
        startClassify();
      } catch (e) {
        document.getElementById('loadingText').textContent = '⚠️ モデル読み込み失敗。ページをリロードしてください。';
        console.error(e);
      }
    }

    function animateProgress() {
      let w = 0;
      const bar = document.getElementById('progressBar');
      const iv = setInterval(() => {
        w = Math.min(w + Math.random() * 8, 88);
        bar.style.width = w + '%';
        if (w >= 88) clearInterval(iv);
      }, 200);
    }

    function newRound() {
      answered = false;
      currentIdx = Math.floor(Math.random() * CLASSES.length);
      document.getElementById('promptWord').textContent = toJa(CLASSES[currentIdx]);
      clearCanvas();
      resetTimer();
      renderConfBars([]);
    }

    function nextRound() {
      document.getElementById('resultOverlay').classList.remove('show');
      newRound();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timeLeft = 20;
      updateTimerUI();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          if (!answered) timeUp();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const pct = timeLeft / 20;
      const offset = CIRCUMFERENCE * (1 - pct);
      document.getElementById('timerArc').style.strokeDashoffset = offset;
      document.getElementById('timerNum').textContent = timeLeft;
      const arc = document.getElementById('timerArc');
      if (pct < 0.3) arc.style.stroke = '#e63946';
      else if (pct < 0.6) arc.style.stroke = '#f4a261';
      else arc.style.stroke = '#2d6a4f';
    }

    function timeUp() {
      answered = true;
      score.w++;
      document.getElementById('wScore').textContent = score.w;
      showResult(false, '時間切れ！', `お題は「${toJa(CLASSES[currentIdx])}」でした`);
    }

    function startClassify() {
      classifyInterval = setInterval(async () => {
        if (!model || answered) return;

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let dark = 0;
        for (let i = 0; i < imgData.data.length; i += 4) {
          if (imgData.data[i] < 200) dark++;
        }
        if (dark < 20) { renderConfBars([]); return; }

        const preds = await classify();
        renderConfBars(preds);

        const topPred = preds[0];
        const matchPred = preds.find(p => p.idx === currentIdx);

        if (matchPred && matchPred.prob > 0.4 && !answered) {
          answered = true;
          clearInterval(timerInterval);
          score.c++;
          document.getElementById('cScore').textContent = score.c;
          const pct = (matchPred.prob * 100).toFixed(0);
          showResult(true, '正解！🎉', `「${toJa(CLASSES[currentIdx])}」を ${pct}% の確信で当てた！`);
        }
      }, 700);
    }

    async function classify() {
      const result = await tf.tidy(() => {
        let t = tf.browser.fromPixels(canvas, 1);
        t = tf.scalar(255).sub(t);

        const resized = t.resizeNearestNeighbor([28, 28])
          .toFloat()
          .div(255.0)
          .reshape([1, 28, 28, 1]);

        return model.predict(resized);
      });

      const probs = await result.data();
      result.dispose();

      return CLASSES.map((cls, i) => ({
        idx: i,
        cls: cls,
        prob: probs[i]
      }))
        .sort((a, b) => b.prob - a.prob)
        .slice(0, 5);
    }
    function renderConfBars(preds) {
      const overlay = document.getElementById('confOverlay');
      if (preds.length === 0) {
        overlay.innerHTML = '';
        return;
      }
      overlay.innerHTML = preds.map((p, i) => {
        const isMatch = p.idx === currentIdx;
        const pct = (p.prob * 100).toFixed(1);
        const barW = Math.min(p.prob * 100 * 1.2, 100);
        return `
      <div class="conf-row visible" style="transition-delay:${i * 0.04}s">
        <div class="conf-label ${isMatch ? 'match' : ''}">${toJa(p.cls)}</div>
        <div class="conf-bar-wrap">
          <div class="conf-bar ${isMatch ? 'match' : ''}" style="width:${barW}%"></div>
        </div>
        <div class="conf-pct ${isMatch ? 'match' : ''}">${pct}%</div>
      </div>`;
      }).join('');
    }

    function showResult(correct, title, detail) {
      document.getElementById('resEmoji').textContent = correct ? '🎉' : '⏰';
      const t = document.getElementById('resTitle');
      t.textContent = title;
      t.className = 'result-title ' + (correct ? 'correct' : 'wrong');
      document.getElementById('resDetail').textContent = detail;
      document.getElementById('resultOverlay').classList.add('show');
    }

    loadModel();
  </script>

</body>

</html>
