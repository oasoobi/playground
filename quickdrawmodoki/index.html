<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>QuickDraw風判定</title>
<style>
  body { font-family: sans-serif; text-align: center; margin: 20px; }
  canvas { border: 1px solid #000; touch-action: none; }
  #result { font-size: 1.2em; margin-top: 10px; }
  button { margin-top: 10px; font-size: 1em; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.9.0/dist/tf.min.js"></script>
</head>
<body>
<h1>QuickDraw風リアルタイム判定</h1>
<canvas id="canvas" width="280" height="280"></canvas><br>
<button id="clearBtn">クリア</button>
<div id="result">ここに判定結果が出ます</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
ctx.lineWidth = 5;
ctx.lineCap = 'round';
ctx.strokeStyle = 'black';

let drawing = false;

// マウス描画
canvas.addEventListener('mousedown', e => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
canvas.addEventListener('mousemove', e => { if(drawing){ ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } });
canvas.addEventListener('mouseup', e => { drawing = false; });

// タッチ描画
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  drawing = true;
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  ctx.beginPath();
  ctx.moveTo(t.clientX - rect.left, t.clientY - rect.top);
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if(drawing){
    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    ctx.lineTo(t.clientX - rect.left, t.clientY - rect.top);
    ctx.stroke();
  }
});
canvas.addEventListener('touchend', e => { drawing = false; });

// クリア
document.getElementById('clearBtn').addEventListener('click', () => {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('result').textContent = "ここに判定結果が出ます";
});

// モデルロード
let model, classes;
async function loadModel() {
  model = await tf.loadLayersModel('https://oasoobi.github.io/playground/quickdrawmodoki/model.json');
  classes = await fetch('https://oasoobi.github.io/playground/quickdrawmodoki/classes.json').then(r=>r.json());
  console.log("モデルロード完了");

  // リアルタイム判定
  setInterval(() => {
    if(!drawing) return; // 描いてる時だけ判定でもいい
    // canvas を Tensor に変換して 28x28 に縮小
    let tensor = tf.browser.fromPixels(canvas)
                  .resizeNearestNeighbor([28,28])
                  .mean(2)
                  .toFloat()
                  .expandDims(0)
                  .expandDims(-1)
                  .div(255);
    let prediction = model.predict(tensor);
    let scores = prediction.dataSync();
    let maxIdx = scores.indexOf(Math.max(...scores));
    document.getElementById('result').textContent = `判定: ${classes[maxIdx]} (${(scores[maxIdx]*100).toFixed(1)}%)`;
    tensor.dispose();
    prediction.dispose();
  }, 500); // 0.5秒ごと
}

loadModel();
</script>
</body>
</html>
