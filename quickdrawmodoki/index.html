<!DOCTYPE html>

<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Draw もどき</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
</head>

<body>

  <header>
    <h1>✏️ Quick Draw もどき</h1>
    <p>自作CNNモデルで判定</p>
    <div class="score-pill">
      <div class="pill c">✅ <span id="cScore">0</span></div>
      <div class="pill w">❌ <span id="wScore">0</span></div>
    </div>
  </header>

  <div class="main">

    <div class="loading-card" id="loadingCard">
      <p id="loadingText">モデルを読み込み中...</p>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="prompt-section">
      <div class="prompt-box">
        <div class="tag">✏️ お題</div>
        <div class="word" id="promptWord">...</div>
      </div>
      <div class="timer-circle" id="timerCircle">
        <svg viewBox="0 0 56 56">
          <circle class="bg" cx="28" cy="28" r="26" />
          <circle class="fg" id="timerArc" cx="28" cy="28" r="26" />
        </svg>
        <div class="timer-num" id="timerNum">20</div>
      </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas" width="1200" height="600"></canvas>
      <div class="confidence-overlay" id="confOverlay">
      </div>
    </div>
    <div class="toolbar">
      <button class="tbtn active" id="penBtn" onclick="setTool('pen')">ペン</button>
      <button class="tbtn" id="eraserBtn" onclick="setTool('eraser')">消しゴム</button>
      <button class="tbtn" onclick="clearCanvas()">全消し</button>
    </div>

  </div>
  <section>
    <h2>QuickDrawの再現</h2>
    <p>CNNモデルは私のUbuntuで学習させたものです。</p>
    <p>使用したもの</p>
    <ul>
      <p>このサイト</p>
      <li><a href="https://www.tensorflow.org/js" target="_blank">TensorFlow.js</a></li>
      <li><a href="https://modi.jpn.org/font_mushin.php" target="_blank">Mushinフォント</a></li>
      <p>学習に使用したライブラリ</p>
      <li>
        <a href="https://github.com/googlecreativelab/quickdraw-dataset" target="_blank">Google QuickDrawデータセット</a></li>
        
      <li><a href="https://www.tensorflow.org/">TensorFlow</a></li>
      <li><a href="https://numpy.org/">Numpy</a></li>
    </ul>
  </section>

  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <span class="result-emoji" id="resEmoji">🎉</span>
      <div class="result-title" id="resTitle">正解！</div>
      <div class="result-detail" id="resDetail"></div>
      <button class="result-next" onclick="nextRound()">次のお題 →</button>
    </div>
  </div>
  <script src="./index.js" />
</body>

</html>
